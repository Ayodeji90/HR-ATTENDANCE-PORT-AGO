version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: geotrackhr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: geotrackhr
      POSTGRES_USER: geotrackhr_user
      POSTGRES_PASSWORD: change_me_in_production
    ports:
      - '${DB_HOST_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U geotrackhr_user -d geotrackhr']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: geotrackhr-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./geotrackhr-backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: geotrackhr-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: geotrackhr
      DB_USER: geotrackhr_user
      DB_PASSWORD: change_me_in_production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in the environment or a .env file}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set in the environment or a .env file}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./geotrackhr-frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: geotrackhr-web
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  uploads: