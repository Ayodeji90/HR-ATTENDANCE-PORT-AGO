# Render Blueprint — deploys the GeoTrackHR backend API + its Postgres database.
# Spec: https://render.com/docs/blueprint-spec
#
# How to use:
#   1. Make sure the branch below (testing) is pushed to GitHub.
#   2. Render dashboard → New + → Blueprint → connect the GitHub repo.
#   3. When prompted for env vars, set CORS_ORIGIN to your Netlify URL
#      (e.g. https://<your-site>.netlify.app — scheme + host, no trailing slash).
#   4. Deploy. The API will be live at https://geotrackhr-api.onrender.com

databases:
  - name: geotrackhr-db
    databaseName: geotrackhr
    user: geotrackhr_user
    plan: free
    region: oregon
    # Note: free Render Postgres instances expire 30 days after creation.
    # If you need the DB to last longer, upgrade the plan or use a hosted
    # Postgres (e.g. Neon) and set DATABASE_URL manually instead.

services:
  - type: web
    name: geotrackhr-api
    runtime: node
    rootDir: geotrackhr-backend
    branch: testing
    region: oregon
    plan: free
    # Node version comes from "engines" in geotrackhr-backend/package.json
    # (pinned to 20.x). Do NOT let Render use its Node 24 default: knex 3.x
    # trips Node 22.7+/24's ESM syntax detection / require(esm) and the app
    # dies with "The requested module 'knex' does not provide an export named
    # 'Knex'". Node 20 loads knex's pure-CJS tree without that machinery.
    # --include=dev is required: Render sets NODE_ENV=production during
    # builds, which otherwise makes npm skip devDependencies (typescript,
    # tsc-alias, @types/*) and the build fails.
    # typescript is pinned to an exact version (5.9.3) in package.json — if
    # it's ever bumped, verify tsc-alias supports the new major before pushing.
    buildCommand: npm install --workspace geotrackhr-backend --include=dev && npm run build
    # Migrations run before the server starts (knex is idempotent, so this is
    # safe on every start). NOTE: preDeployCommand is NOT supported on free
    # tier, so migrations run inside startCommand instead.
    startCommand: node dist/database/migrate.js && node dist/server.js
    healthCheckPath: /api/health
    # Demo seed data (admin + demo employees/sites) is inserted once, after
    # the first successful deploy. It truncates the tables, so it must NOT
    # run on every deploy — hence initialDeployHook (supported on free tier).
    initialDeployHook: node dist/database/seed.js
    envVars:
      - key: NODE_ENV
        value: production
      # Wired automatically to the Postgres instance created above
      # (private network connection string).
      - key: DATABASE_URL
        fromDatabase:
          name: geotrackhr-db
          property: connectionString
      # Render's managed Postgres presents a self-signed cert on its internal
      # connection, which Node rejects by default (DEPTH_ZERO_SELF_SIGNED_CERT
      # at deploy). Trust the server cert — required for Render Postgres. If
      # you point DATABASE_URL at a provider with a proper CA (e.g. Neon),
      # you can remove this.
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      # Random secrets generated by Render on creation.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Prompted at blueprint creation — paste your Netlify URL here.
      # The backend refuses cross-origin requests from any other origin.
      - key: CORS_ORIGIN
        sync: false
