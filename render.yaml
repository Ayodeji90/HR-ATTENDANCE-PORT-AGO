# Render Blueprint — deploys the GeoTrackHR backend API + its Postgres database.
# Spec: https://render.com/docs/blueprint-spec
#
# How to use:
#   1. Make sure the branch below (testing) is pushed to GitHub.
#   2. Render dashboard → New + → Blueprint → connect the GitHub repo.
#   3. When prompted for env vars, set CORS_ORIGIN to your Netlify URL
#      (e.g. https://<your-site>.netlify.app — scheme + host, no trailing slash).
#   4. Deploy. The API will be live at https://geotrackhr-api.onrender.com

databases:
  - name: geotrackhr-db
    databaseName: geotrackhr
    user: geotrackhr_user
    plan: free
    region: oregon
    # Note: free Render Postgres instances expire 30 days after creation.
    # If you need the DB to last longer, upgrade the plan or use a hosted
    # Postgres (e.g. Neon) and set DATABASE_URL manually instead.

services:
  - type: web
    name: geotrackhr-api
    runtime: node
    rootDir: geotrackhr-backend
    branch: testing
    region: oregon
    plan: free
    # Node version comes from "engines" in geotrackhr-backend/package.json
    # (pinned to 20.x). Do NOT let Render use its Node 24 default: knex 3.x
    # trips Node 22.7+/24's ESM syntax detection / require(esm) and the app
    # dies with "The requested module 'knex' does not provide an export named
    # 'Knex'". Node 20 loads knex's pure-CJS tree without that machinery.
    # The backend package also declares "type": "commonjs" so Node never
    # misdetects the compiled migrations/seeds as ESM ("Unexpected token '{'"
    # in knex's import-file.js). Keep both settings.
    # --include=dev is required: Render sets NODE_ENV=production during
    # builds, which otherwise makes npm skip devDependencies (typescript,
    # tsc-alias, @types/*) and the build fails.
    # typescript is pinned to an exact version (5.9.3) in package.json — if
    # it's ever bumped, verify tsc-alias supports the new major before pushing.
    # The final 'node scripts/to-cjs.js' renames the compiled migration/seed
    # files to .cjs so Node's ESM syntax detection can never misclassify them
    # (fixes "Unexpected token '{'" in knex's import-file.js). knexfile
    # production config uses extension 'cjs' to match.
    # Facial verification (@vladmandic/face-api on @tensorflow/tfjs-node)
    # needs a working compiler during install: tfjs-node ships prebuilt
    # binaries for linux-x64 Node 20 (Render's default image), so the npm
    # install downloads the .node binding instead of compiling it. Model
    # files are committed under geotrackhr-backend/models/facial/.
    buildCommand: npm install --workspace geotrackhr-backend --include=dev && npm run build && node scripts/to-cjs.js
    # Migrations run before the server starts (knex is idempotent, so this is
    # safe on every start). The demo seed (admin + demo employees/sites) runs
    # after migrations on EVERY deploy, but seed.js is idempotent: it skips
    # when the users table already has rows (--force wipes & re-seeds), so a
    # populated database is never touched. This replaces the one-shot
    # initialDeployHook, which only fired on the service's very first deploy
    # and never actually seeded the DB.
    # NOTE: preDeployCommand is NOT supported on free tier, so migrations run
    # inside startCommand instead.
    # NODE_OPTIONS=--no-experimental-detect-module disables Node's ESM syntax
    # detection, which otherwise misclassifies knex's compiled migration files
    # as ESM and dies with "Unexpected token '{'" in import-file.js. If a
    # future Node drops/renames the flag, the deploy fails loudly with a clear
    # "bad option" error — remove it then.
    startCommand: NODE_OPTIONS=--no-experimental-detect-module node dist/database/migrate.js && NODE_OPTIONS=--no-experimental-detect-module node dist/database/seed.js && NODE_OPTIONS=--no-experimental-detect-module node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Wired automatically to the Postgres instance created above
      # (private network connection string).
      - key: DATABASE_URL
        fromDatabase:
          name: geotrackhr-db
          property: connectionString
      # Render's managed Postgres presents a self-signed cert on its internal
      # connection, which Node rejects by default (DEPTH_ZERO_SELF_SIGNED_CERT
      # at deploy). Trust the server cert — required for Render Postgres. If
      # you point DATABASE_URL at a provider with a proper CA (e.g. Neon),
      # you can remove this.
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      # Random secrets generated by Render on creation.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # OPTIONAL override — if set, a comma-separated allowlist of allowed
      # origins. If left empty, the code default already allows
      # http://localhost:5173 and https://hrportago.netlify.app (see
      # geotrackhr-backend/src/config/index.ts).
      - key: CORS_ORIGIN
        sync: false
      # OPTIONAL demo mode — set to true to bypass the geofence + time-window
      # attendance policy so punches can be tested from anywhere at any time.
      # Demo mode ALSO skips facial verification (no enrollment needed).
      # Set it in the Render dashboard (Environment tab → save). Left empty
      # (or false), the strict attendance rules apply.
      - key: ATTENDANCE_DEMO_MODE
        sync: false
      # OPTIONAL — facial-match sensitivity. Maximum euclidean distance between
      # the live selfie embedding and the enrolled template (0.6 default; lower
      # = stricter). Same-person faces score < 0.6, strangers > 0.6.
      - key: FACIAL_MATCH_THRESHOLD
        sync: false
      # OPTIONAL — directory with the face-api model files. Defaults to
      # ./models/facial (committed to the repo) — no need to set.
      - key: FACIAL_MODEL_DIR
        sync: false
